name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        if: ${{ env.HF_TOKEN != '' }}
        run: |
          git lfs pull
          rm -rf /tmp/space && mkdir -p /tmp/space/dashboard && cp -a backend/. /tmp/space/ && cp -a frontend/. /tmp/space/dashboard/
          rm -f /tmp/space/AI-model/best.pt
          cd /tmp/space
          git init -b main && git lfs install --local
          git config user.email "ci@example.com" && git config user.name "ci"
          git add -A && git commit -m "Deploy backend from ${GITHUB_SHA}"
          git remote add hf https://iam-pradeepkumar:$HF_TOKEN@huggingface.co/spaces/iam-pradeepkumar/AlertX
          git push --force hf main
